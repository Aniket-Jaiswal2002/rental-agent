<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Renter Intake Agent</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Renter intake agent</h1>
    <span class="tag warn">Listings are SYNTHETIC demo data</span>
    <span id="mode" class="tag" hidden></span>
    <button id="reset" class="ghost">New conversation</button>
  </header>

  <main>
    <section class="chat">
      <div id="transcript" aria-live="polite">
        <p class="hint">Hold the button (or Space) and say what you're looking for, e.g.
          <em>"2 BHK in Sector 56, budget 30k, moving 1st December, office in Cyber City."</em> Hinglish works too.</p>
      </div>
      <div class="controls">
        <button id="ptt" title="Hold to talk (or hold Space)"><span class="dot"></span><span id="ptt-label">Hold to talk</span></button>
        <form id="textform">
          <input id="text" placeholder="…or type a message" autocomplete="off" aria-label="Message">
          <button type="submit">Send</button>
        </form>
      </div>
      <div id="status" class="status"></div>
      <div id="latency" class="latency" aria-label="Last turn latency"></div>
    </section>

    <aside class="memory">
      <div class="memory-head">
        <h2>Renter profile</h2>
        <span class="sub">agent memory, updated every turn</span>
      </div>
      <div id="stage" class="stage"></div>
      <div id="asking" class="asking"></div>
      <dl id="profile"></dl>
      <h3>Memory changes</h3>
      <ol id="changelog"></ol>
    </aside>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
